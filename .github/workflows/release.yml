name: Deploy Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Desktop Binary
    runs-on: windows-latest

    steps:
    - name: Clone Repository Content
      uses: actions/checkout@v4

    - name: Configure .NET Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Compile Windows Executable
      run: dotnet publish "TMGS4SaveEditor.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win

    - name: Archive Windows Artifacts
      run: Compress-Archive -Path ./publish/win/* -DestinationPath TMGS4SaveEditor-Windows.zip

    - name: Upload Windows Asset to Release
      uses: softprops/action-gh-release@v2
      with:
        files: TMGS4SaveEditor-Windows.zip
        allowUpdates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: Package macOS App Bundle
    runs-on: macos-latest

    steps:
    - name: Clone Repository Content
      uses: actions/checkout@v4

    - name: Configure .NET Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Compile macOS Binary
      run: dotnet publish "TMGS4SaveEditor.csproj" -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o ./publish/mac-raw

    - name: Assemble Native App Bundle Directory
      run: |
        APP_DIR="./publish/mac/TMGS4SaveEditor.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources"
        
        cp ./publish/mac-raw/TMGS4SaveEditor "$APP_DIR/Contents/MacOS/"
        chmod +x "$APP_DIR/Contents/MacOS/TMGS4SaveEditor"
        
        cat <<EOF > "$APP_DIR/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>TMGS4SaveEditor</string>
            <key>CFBundleDisplayName</key>
            <string>TMGS 4 Save Editor</string>
            <key>CFBundleIdentifier</key>
            <string>com.tmgs4.saveeditor</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleExecutable</key>
            <string>TMGS4SaveEditor</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Archive macOS Bundle
      run: |
        cd ./publish/mac
        zip -r ../../TMGS4SaveEditor-Mac-ARM64.zip TMGS4SaveEditor.app

    - name: Upload macOS Asset to Release
      uses: softprops/action-gh-release@v2
      with:
        files: TMGS4SaveEditor-Mac-ARM64.zip
        allowUpdates: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}